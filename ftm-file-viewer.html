<!doctype html>
<html lang="ar" dir="rtl" data-no-global-dock>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاينة ملفات المعلمة | FTM</title>
  <link rel="stylesheet" href="assets/css/core.css">

  <link rel="stylesheet" href="assets/css/pages/ftm-file-viewer.css?v=20261109-no-dock-v1">
</head>
<body class="ftm-file-viewer-page">
  <header class="ftm-viewer-header no-print">
    <div><h1>معاينة الملفات</h1><p id="ftm-viewer-subtitle">قراءة الملف من خزنة المتصفح</p></div>

  <main class="ftm-viewer-main">

        <a id="ftm-viewer-open" class="btn btn-primary" target="_blank" rel="noopener">فتح في تبويب المتصفح دون تنزيل</a>
        <a id="ftm-viewer-download" class="btn btn-outline">تنزيل نسخة</a>
      </div>
      <p id="ftm-viewer-help" class="ftm-viewer-help"></p>
    </section>
  </main>
  <script src="assets/js/core/engines.js?v=20261109-no-dock-v1"></script>
